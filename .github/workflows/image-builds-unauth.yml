name: Build Container Images as Anonymous
on:
  pull_request:
    paths-ignore:
      - 'oracle/**'
      - 'build-oracle.sh'

jobs:
  # Checks that all commits contain sign-offs
  check-signed-commits:
    name: Check signed commits
    runs-on: ubuntu-latest
    steps:
      - uses: debezium/dbz/.github/actions/check-dco@main
  build:
    needs: [ check-signed-commits ]
    # Try to build as much as possible, even if a single job fails
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        component: ['postgres', 'debezium', 'tool']
    runs-on: ubuntu-latest
    env:
      DEBEZIUM_DOCKER_REGISTRY_PRIMARY_NAME: localhost:5500/debeziumquay
      DEBEZIUM_DOCKER_REGISTRY_SECONDARY_NAME: localhost:5500/debezium
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build Scripts
        run: shellcheck build-*.sh ./script-functions/*.sh
      - name: Start local docker registry
        run: docker run -d -p 5500:5000 --restart=always --name registry registry:2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
      - name: Build Component ${{ matrix.component }}
        if: matrix.component != 'tool'
        env:
          SKIP_UI: true
          PLATFORM_STAGE_PLATFORM: linux/amd64
        run: ./build-all-multiplatform.sh ${{ matrix.component }}
      - name: Build Tool Images
        if: matrix.component == 'tool'
        run: ./build-tool-images.sh latest

  server-runtime:
    name: Server runtime (${{ matrix.runner }})
    timeout-minutes: 30
    needs: [ check-signed-commits ]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build Server 3.8 runtime image
        run: docker build --progress=plain -t debezium/server:runtime-test server/3.8
      - name: Check runtime tools and random UID permissions
        run: |
          docker run --rm --entrypoint bash debezium/server:runtime-test -ec '
            test "$(id -u)" = 185
            java -version
            for tool in keytool awk curl find chmod; do command -v "$tool"; done
          '
          docker run --rm --user 12345:0 --entrypoint bash debezium/server:runtime-test -ec '
            touch /debezium/config/permission-test /debezium/data/permission-test
            cp "$JAVA_HOME/lib/security/cacerts" /tmp/cacerts
            keytool -list -keystore /tmp/cacerts -storepass changeit >/dev/null
          '
